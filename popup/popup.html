<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WORK TIME</title><link rel="stylesheet" href="../shared/ui.css"></head>
<body class="popup-page"><main class="popup-shell">
 <header class="popup-header"><div class="brand"><span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3"/><rect x="9" y="9" width="6" height="6" rx="2"/></svg></span><div><span class="wordmark">WORK TIME<span class="brand-dot">.</span></span></div></div><button class="icon-button" id="open-options" title="Ouvrir le planning et les réglages" aria-label="Ouvrir le planning et les réglages"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h4l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3Z"/><circle cx="11" cy="12" r="3"/></svg></button></header>
 <section class="status-card" id="status-card" aria-live="polite">
 <div class="status-top"><span class="status-pill" id="status-label"><span class="status-dot"></span><span id="status-label-text">Chargement…</span></span><svg class="status-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3"/><rect x="9" y="9" width="6" height="6" rx="2"/></svg></div>
 <h2 id="status-title">Un YouTube plus tranquille.</h2><p id="status-description">Votre espace, votre rythme.</p>
 <div class="status-time"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="status-time">Lecture du planning…</span></div>
</section>
 <section class="popup-mode"><h2 class="field-label">Mode d’activation</h2><div class="mode-control" role="group" aria-label="Mode d’activation"><button type="button" data-mode="auto" aria-pressed="true">Planning</button><button type="button" data-mode="on" aria-pressed="false">Toujours actif</button><button type="button" data-mode="off" aria-pressed="false">Désactivé</button></div></section>
 <section class="popup-settings" aria-label="Filtre YouTube"><div class="setting-row"><span class="setting-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8" cy="9" r="1.5"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg></span><span class="setting-copy"><strong>Miniatures apaisées</strong><span>Remplacées par « WORK TIME ».</span></span><span class="included-tag">Inclus</span></div><label class="setting-row" for="blur-titles"><span class="setting-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M12 5v15M8 20h8M4 5v3m16-3v3"/></svg></span><span class="setting-copy"><strong>Flouter les informations</strong><span>Titre, chaîne, vues… Survolez pour lire.</span></span><span class="switch"><input type="checkbox" id="blur-titles"><span class="switch-track"></span></span></label></section>
 <button class="pause-button" id="pause-toggle"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg><span>Faire une pause de 15 min</span></button>
 <button class="planning-link" id="planning-link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Mon planning hebdomadaire</span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
 <footer class="popup-footer"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/></svg><span>Rien n’est bloqué. Vous gardez la main.</span></footer>
 <p class="save-state popup-save" id="save-state" role="status" aria-live="polite"></p>
</main><script src="../shared/schedule.js"></script><script src="../shared/ui.js"></script><script src="popup.js"></script></body></html>
